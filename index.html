<style>

*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.15}

.roles{margin-left:auto;display:flex;gap:4px;background:rgba(0,0,0,.25);padding:3px;border-radius:99px}

nav{display:flex;gap:2px;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--ln);padding:0 8px}

main{max-width:980px;margin:0 auto;padding:16px}
.demo{background:#fff5dc;color:#5b4310;border:1px solid #ecd28f;border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;white-space:nowrap}
.chip.on{background:var(--br);color:#fff;border-color:var(--br)}

label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:.88rem}
.btn{border:0;background:var(--br);color:#fff;padding:9px 16px;border-radius:8px;font:600 .95rem 'Source Sans 3',sans-serif;cursor:pointer}
.btn.ac{background:var(--ac);color:#1b1405}.btn.ln{background:none;color:var(--br);border:1px solid var(--br)}.btn.er{background:var(--er)}
.btn:focus-visible,.chip:focus-visible,nav button:focus-visible,.roles button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tier{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#eee;color:#333}
.t-Bronze{background:#e8cdb0}.t-Silver{background:#dfe3e6}.t-Gold{background:#f3d98a}.t-Platinum{background:#cfe9e4}
.star{color:var(--ac)}
.steps{display:flex;gap:4px;margin:10px 0}.steps span{flex:1;height:6px;border-radius:3px;background:var(--ln)}.steps span.d{background:var(--br)}
.tag{font-size:.8rem;font-weight:600;color:var(--br)}.bad{color:var(--er)}
dialog{border:0;border-radius:12px;max-width:460px;width:calc(100% - 24px);background:var(--sf);color:var(--tx);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat .card b{font:800 1.5rem 'Bricolage Grotesque',sans-serif;display:block}
.hero{margin-bottom:14px}.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:-.02em}
.empty{text-align:center;padding:28px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.meter{height:6px;background:var(--ln);border-radius:3px;margin:2px 0 8px}.meter i{display:block;height:100%;background:var(--ac);border-radius:3px}
header button[data-out]{border:1px solid #fff8;background:none;color:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.85rem}
#inv td:last-child,#inv th:last-child{text-align:right}#inv td{white-space:normal}
@media print{body>*:not(dialog){display:none!important}dialog{position:static;border:0}[data-x],[data-prt]{display:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>

  {id:'p2',name:'Yaw Boateng',cat:'Transport',city:'Accra',price:60,bio:'Ride hailing and airport runs.',jobs:210,rsum:960,rn:210,status:'approved',pts:1400,docs:'Ghana Card, licence'},

 const ap=S.pros.filter(p=>p.status==='approved'),cs=S.users.filter(u=>u.role==='customer');

Object.defineProperty(S,'me',{get(){return S.users.find(u=>u.id===S.sess)}});Object.defineProperty(S,'pro',{get(){return S.me&&S.me.pid}});FEE=S.cfg.fee/100;CATS=['All',...S.cats.map(c=>c.name)];

 const list=S.pros.filter(p=>p.status==='approved'&&(cat==='All'||p.cat===cat)&&(p.name+p.bio+p.cat+p.city).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.pts-a.pts);
 return `<div class="hero"><h1>Skilled hands, close to you.</h1><p class="mu">Carpenters, plumbers, drivers and riders. Verified, rated, paid securely.</p></div>

 ${['paid','accepted','in_progress','completed'].includes(o.status)?`<button class="btn ln" data-comp="${o.id}">Complaint</button>`:''}</span></div></div>`}).join('')+'</div>';

 const l=S.orders.filter(o=>o.pid===S.pro).reverse();const p=pro(S.pro);

 ${p.status!=='approved'?'<div class="demo">Your account is waiting for admin approval. You will appear in search once approved.</div>':''}
 <h2 style="margin:16px 0 8px">Job history</h2>`+(l.length?'<div class="grid">'+l.map(o=>`<div class="card"><div class="row"><b>#${o.id}</b><span class="tag">${LBL[o.status]}</span></div><p>${esc(o.note)}</p><div class="row"><span>${money(o.amt)}</span><span>

let authMode='in',authErr='',authInfo='',pend='',rng={f:'',t:''},stP='',RQ=null;

const norm=s=>s.toLowerCase().replace(/\s/g,''),okId=id=>/^\S+@\S+\.\S+$/.test(id)||/^\+?\d{9,15}$/.test(id),sum=(a,f)=>a.reduce((x,o)=>x+f(o),0);

function calc(o){const c=ct(o.cat),r=(o.rate??c.fee)/100,pf=o.amt*(o.ps??S.cfg.ps)/100,py=o.payer||c.payer,comm=o.amt*r;return{comm,pf,py,pay:o.amt+(py==='customer'?pf:0),out:o.amt-comm-(py==='handyman'?pf:0),net:comm-(py==='platform'?pf:0)}}

const kp=(v,l)=>`<div class="card"><b>${v}</b>${l}</div>`,invNo=o=>`${S.cfg.prefix}-${new Date(o.at).getFullYear()}-${o.id.slice(1)}`;
function sendCode(id){const c=String(100000+Math.floor(Math.random()*9e5));S.codes[id]={c,exp:Date.now()+10*6e4};authInfo='Demo only: your code is '+c+'. The live app sends it by SMS or email.'}
function auth(){const M=authMode,su=M==='up';

 ${authInfo?`<div class="demo">${esc(authInfo)}</div>`:''}${authErr?`<p class="bad" role="alert">${esc(authErr)}</p>`:''}

 ${M==='in'||su||M==='forgot'?'<label>Email or phone number</label><input id="au_i" autocomplete="username">':`<p class="mu">Enter the 6-digit code for ${esc(pend)}.</p><label>Code</label><input id="au_c" inputmode="numeric" maxlength="6">`}

function stRows(pid){const p=pro(pid),T=[0,0,0,0],r=S.orders.filter(o=>o.pid===pid&&o.status==='completed'&&inR(o)).map(o=>{const c=calc(o),f=c.py==='handyman'?c.pf:0;T[0]+=o.amt;T[1]+=c.comm;T[2]+=f;T[3]+=c.out;return [fmtD(o.at),o.id,o.note,o.amt.toFixed(2),(o.rate??ct(o.cat).fee)+'%',c.comm.toFixed(2),f.toFixed(2),c.out.toFixed(2)]});

 if(k==='invoices')return [['Invoice','Date','Customer','Handyman','Total paid','Platform fee','Tax %','Tax included']].concat(O.filter(o=>o.status==='completed').map(o=>{const c=calc(o);return [invNo(o),iso(o.at),uname(o.cid),pro(o.pid).name,c.pay.toFixed(2),c.comm.toFixed(2),S.cfg.tax,(c.pay-c.pay/(1+S.cfg.tax/100)).toFixed(2)]}));

 try{let b;if(f==='xlsx'){if(!window.XLSX)return alert('The Excel library did not load. Use CSV.');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(C),'Data');b=new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})])}
 else b=new Blob(['\ufeff'+C.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
 await d.save({filename:`handyman-${k}-${new Date().toISOString().slice(0,10)}.${f}`,data:b})}catch(e){if(!e||e.code!=='declined')alert('Could not save the file.')}}

 else if(t.id==='ar_go'){const g=i=>document.getElementById(i).value.trim(),n=g('ar_n');if(!n||!(+g('ar_b')>=0)||!(+g('ar_k')>0)){alert('Enter the area name, base fare and per-km rate.');return}

 else if(t.id==='cf_go'){const g=i=>document.getElementById(i).value.trim(),ps=+g('cf_ps'),tx=+g('cf_tax');if(!(ps>=0&&ps<=10)||!(tx>=0&&tx<=50)){alert('Check the processing fee and tax percentages.');return}

 else if(D.rs!==undefined){sendCode(pend);save();render()}
 else if(t.id==='au_go'){const g=i=>(document.getElementById(i)||{value:''}).value.trim(),er=m=>{authErr=m;render()},now=Date.now(),pwv=()=>document.getElementById('au_p').value;
  if(authMode==='verify'){const c=S.codes[pend];if(!c||c.exp<now)return er('Code expired. Tap Resend code.');if(g('au_c')!==c.c)return er('Wrong code.');S.users.find(u=>u.ident===pend).verified=1;delete S.codes[pend];authMode='in';authErr='';authInfo='Verified. You can sign in now.';save();return render()}

  const id=norm(g('au_i')),pw=pwv();if(!okId(id))return er('Enter a valid email or phone number.');
  if(authMode==='in'){const f=S.fails[id]||(S.fails[id]={n:0,until:0});if(f.until>now)return er('Too many attempts. Try again in '+Math.ceil((f.until-now)/6e4)+' minutes, or reset your password.');
   const u=S.users.find(x=>x.ident===id&&x.pw===h(pw));
   if(!u){f.n++;if(f.n>=5){f.until=now+15*6e4;f.n=0;save();return er('Too many attempts. Locked for 15 minutes.')}save();return er('Wrong email, phone or password. '+(5-f.n)+' attempts left.')}
   f.n=0;if(u.verified===0){pend=id;sendCode(id);authMode='verify';authErr='';save();return render()}S.sess=u.id}

   S.users.push(u);pend=id;sendCode(id);authMode='verify';authErr='';save();return render()}
  authErr='';authInfo='';tab='';save();render()}
